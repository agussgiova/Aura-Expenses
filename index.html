  <!-- Mode Selector Tabs -->

        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-on-surface-variant text-xl">lock</span>

        <input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="reg-password" name="password" placeholder="Mínimo 4 caracteres" type="password" autocomplete="new-password"/>

  <!-- Social Logins -->

      <svg class="w-5 h-5" viewBox="0 0 24 24">

        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.6 7.5 23.5 12 23.5z"/>

<!-- SOCIAL AUTH POPUP MODAL -->
<div id="social-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
  <div class="w-full max-w-sm bg-surface-container-low border border-outline-variant/30 rounded-2xl p-6 shadow-2xl flex flex-col gap-5 relative fade-in">
    <div class="flex justify-between items-center border-b border-outline-variant/10 pb-3">
      <div class="flex items-center gap-2.5">
        <span id="modal-provider-icon" class="text-2xl"></span>
        <h3 class="font-headline-md text-headline-md text-on-surface font-semibold" id="social-modal-title">Continuar con Google</h3>
      </div>
      <button onclick="closeSocialModal()" class="text-on-surface-variant hover:text-on-surface p-1.5 rounded-full hover:bg-surface-variant/30">
        <span class="material-symbols-outlined">close</span>

    <p class="font-body-md text-body-md text-on-surface-variant text-sm" id="social-modal-desc">

    <button id="social-confirm-btn" onclick="confirmSocialAuth()" class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-label-md text-label-md py-3 rounded-lg flex items-center justify-center gap-2 font-semibold transition-all shadow-md">

<p class="z-10 mt-6 font-label-sm text-label-sm text-on-surface-variant/40">Aura Finance © 2024</p>

<script>
  const DEMO_USER = { email: 'demo@aura.com', password: 'demo1234', name: 'Usuario Demo' };
  let currentProvider = '';

  function getUsers() {
    return JSON.parse(localStorage.getItem('aura_users') || '[]');
  }

  function saveUser(user) {
    const users = getUsers();
    users.push(user);
    localStorage.setItem('aura_users', JSON.stringify(users));
  }

  function setSessionAndGo(userData) {
    const serialized = JSON.stringify(userData);
    sessionStorage.setItem('aura_user', serialized);
    localStorage.setItem('aura_active_user', serialized);
    window.location.replace('dashboard.html');
  }

  function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function setAuthMode(mode) {
    const loginForm = document.getElementById('login-form');
    const regForm = document.getElementById('register-form');
    const tabLogin = document.getElementById('tab-login');
    const tabReg = document.getElementById('tab-register');
    const cardTitle = document.getElementById('card-title');
    const cardDesc = document.getElementById('card-desc');
    hideAlert();

    if (mode === 'login') {
      loginForm.classList.remove('hidden');
      regForm.classList.add('hidden');
      tabLogin.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all text-center bg-surface-variant text-on-surface shadow-sm';
      tabReg.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all text-center text-on-surface-variant hover:text-on-surface';
      cardTitle.textContent = 'Iniciar Sesión';
      cardDesc.textContent = 'Gestiona tus finanzas y gastos con total precisión.';
    } else {
      loginForm.classList.add('hidden');
      regForm.classList.remove('hidden');
      tabReg.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all text-center bg-secondary-container text-on-secondary-container shadow-sm';
      tabLogin.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all text-center text-on-surface-variant hover:text-on-surface';
      cardTitle.textContent = 'Crear Cuenta';
      cardDesc.textContent = 'Crea tu cuenta personal para llevar el control de tus finanzas.';
    }
  }

  function showAlert(msg, isSuccess = false) {
    const banner = document.getElementById('alert-banner');
    const txt = document.getElementById('alert-msg');
    const icon = document.getElementById('alert-icon');
    banner.className = isSuccess 
      ? 'bg-secondary-container/30 border border-secondary/40 text-secondary rounded-lg px-4 py-3 text-sm flex items-center gap-2 fade-in'
      : 'bg-error-container/60 border border-error/30 text-error rounded-lg px-4 py-3 text-sm flex items-center gap-2 fade-in';
    icon.textContent = isSuccess ? 'check_circle' : 'error';
    txt.textContent = msg;
    banner.classList.remove('hidden');
  }

  function hideAlert() {
    document.getElementById('alert-banner').classList.add('hidden');
  }

  // Login Submit
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    hideAlert();
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');

    if (!email || !password) {
      showAlert('Por favor completa todos los campos.');
      document.getElementById('login-form').classList.add('shake');
      setTimeout(() => document.getElementById('login-form').classList.remove('shake'), 400);
      return;
    }

    let matchedUser = null;
    if (email === DEMO_USER.email && password === DEMO_USER.password) {
      matchedUser = DEMO_USER;
    } else {
      const users = getUsers();
      matchedUser = users.find(u => u.email === email && u.password === password);
    }

    if (matchedUser) {
      showAlert(`¡Bienvenido, ${matchedUser.name}!`, true);
      setSessionAndGo({ name: matchedUser.name, email: matchedUser.email });
    } else {
      showAlert('Correo o contraseña incorrectos. Verifica tus datos.');
      document.getElementById('login-form').classList.add('shake');
      setTimeout(() => document.getElementById('login-form').classList.remove('shake'), 400);
    }
  });

  // Register Submit
  document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    hideAlert();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim().toLowerCase();
    const password = document.getElementById('reg-password').value;
    const passwordConfirm = document.getElementById('reg-password-confirm').value;

    if (!name || !email || !password) {
      showAlert('Por favor completa todos los campos requeridos.');
      return;
    }
    if (password.length < 4) {
      showAlert('La contraseña debe tener al menos 4 caracteres.');
      return;
    }
    if (password !== passwordConfirm) {
      showAlert('Las contraseñas no coinciden.');
      return;
    }

    const users = getUsers();
    if (email === DEMO_USER.email || users.some(u => u.email === email)) {
      showAlert('Este correo ya está registrado. Inicia sesión directamente.');
      return;
    }

    const newUser = { name, email, password, createdAt: new Date().toISOString() };
    saveUser(newUser);
    showAlert(`¡Cuenta creada con éxito! Bienvenido, ${name}`, true);
    setSessionAndGo({ name: newUser.name, email: newUser.email });
  });

  // Social Auth Modals (Google & Apple)
  function openSocialModal(provider) {
    currentProvider = provider;
    const modal = document.getElementById('social-modal');
    const title = document.getElementById('social-modal-title');
    const desc = document.getElementById('social-modal-desc');
    const icon = document.getElementById('modal-provider-icon');
    const nameInput = document.getElementById('social-input-name');
    const emailInput = document.getElementById('social-input-email');

    if (provider === 'Google') {
      title.textContent = 'Acceder con Google';
      desc.textContent = 'Confirma tu perfil de Google para iniciar sesión rápidamente:';
      icon.innerHTML = `<svg class="w-6 h-6 inline" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.6 7.5 23.5 12 23.5z"/></svg>`;
      nameInput.value = 'Usuario Google';
      emailInput.value = 'usuario@gmail.com';
    } else {
      title.textContent = 'Acceder con Apple ID';
      desc.textContent = 'Confirma tu ID de Apple para continuar:';
      icon.innerHTML = `<svg class="w-6 h-6 inline fill-current text-on-surface" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.86c.65-.79 1.09-1.89.97-2.99-1 .04-2.15.65-2.82 1.44-.58.68-1.1 1.77-.96 2.85 1.12.09 2.16-.51 2.81-1.3z"/></svg>`;
      nameInput.value = 'Usuario Apple';
      emailInput.value = 'usuario@icloud.com';
    }

    modal.classList.remove('hidden');
  }

  function closeSocialModal() {
    document.getElementById('social-modal').classList.add('hidden');
  }

  function confirmSocialAuth() {
    const name = document.getElementById('social-input-name').value.trim() || `Usuario ${currentProvider}`;
    const email = document.getElementById('social-input-email').value.trim() || `user@${currentProvider.toLowerCase()}.com`;

    closeSocialModal();
    setSessionAndGo({ name, email, provider: currentProvider });
  }

  // Check if session active
  if (sessionStorage.getItem('aura_user') || localStorage.getItem('aura_active_user')) {
    window.location.replace('dashboard.html');
  }
</script>
